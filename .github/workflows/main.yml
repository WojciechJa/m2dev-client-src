name: build

on:
  push:
    branches:
      - main
      - dx11-world-render
  pull_request:
    branches:
      - main
      - dx11-world-render
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  win:
    name: "Windows Build"
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run first-party checks
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Configure project
        shell: pwsh
        run: cmake -S . -B build -DDX11_STRICT_ONLY=ON

      - name: Build verified DX11 client
        id: build_project
        shell: pwsh
        run: >-
          cmake --build build --config RelWithDebInfo --target
          dx11_strict_gate
          EterLib
          EffectLib
          EterGrnLib
          EterPythonLib
          GameLib
          PRTerrainLib
          SphereLib
          SpeedTreeLib
          UserInterface

      - name: Configure optional DebugUI
        shell: pwsh
        run: >-
          cmake -S . -B build-debug-ui
          -DDX11_STRICT_ONLY=ON
          -DBUILD_DEBUG_UI=ON

      - name: Build optional DebugUI
        shell: pwsh
        run: cmake --build build-debug-ui --config RelWithDebInfo --target DebugUI

      - name: Collect outputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path _output | Out-Null
          $targets = @(
            'EterLib',
            'EffectLib',
            'EterGrnLib',
            'EterPythonLib',
            'GameLib',
            'PRTerrainLib',
            'SphereLib',
            'SpeedTreeLib'
          )
          foreach ($target in $targets) {
            $artifact = Get-ChildItem -Path "build/src/$target/RelWithDebInfo" -Filter "$target.lib" -File
            if (-not $artifact) { throw "Missing build artifact: $target.lib" }
            Copy-Item -LiteralPath $artifact.FullName -Destination _output
          }
          $client = Get-Item -LiteralPath 'build/bin/Metin2_RelWithDebInfo.exe'
          Copy-Item -LiteralPath $client.FullName -Destination _output

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: dx11_client_win
          path: _output
          if-no-files-found: error
