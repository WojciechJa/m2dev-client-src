name: notify-code-map
on:
  push:
    branches: [dx11-world-render, main]
permissions:
  contents: read
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch documentation rebuild
        env:
          GH_TOKEN: ${{ secrets.M2DEV_DOCS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::Dispatch skipped until M2DEV_DOCS_DISPATCH_TOKEN is configured."
            exit 0
          fi
          gh api --method POST repos/WojciechJa/m2dev-docs/dispatches \
            -f event_type=source-updated \
            -F client_payload[repository]=classic-client-src \
            -F client_payload[sha]="${{ github.sha }}"
